<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880"
  font-family="Pretendard Variable, Pretendard, -apple-system, BlinkMacSystemFont, sans-serif" role="img"
  aria-label="COGI 처리 흐름 — PR 수신부터 약점 누적, 학습 카드, 주간 리포트까지">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f9ff" />
      <stop offset="1" stop-color="#e8f3ff" />
    </linearGradient>
    <filter id="cCard" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1b2a4a" flood-opacity=".10" />
    </filter>
    <filter id="cLift" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2a4a" flood-opacity=".16" />
    </filter>
    <marker id="cArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.4 L9 5 L0 8.6 Z" fill="#8fa3c4" />
    </marker>
    <marker id="cArrowMint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1.4 L9 5 L0 8.6 Z" fill="#3fb894" />
    </marker>
  </defs>

  <rect width="1240" height="880" fill="url(#cSky)" />

  <!-- 제목 -->
  <text x="64" y="74" font-size="30" font-weight="700" fill="#1b2a4a" letter-spacing="-.8">COGI 처리 흐름</text>
  <text x="64" y="104" font-size="14.5" fill="#5c7099">리뷰 한 건이 약점 통계와 학습 카드로 남는 경로</text>
  <g transform="translate(1176 62)">
    <circle r="7" fill="#ff6b57" />
    <circle r="7" cx="-22" fill="#ffd23f" />
    <circle r="7" cx="-44" fill="#4ec9a4" />
  </g>

  <!-- ── 레인 라벨 ───────────────────────────────────────── -->
  <g font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#93a6c6">
    <text x="64" y="158">01 · 코드가 들어온다</text>
    <text x="64" y="330">02 · AI가 리뷰한다</text>
    <text x="64" y="556">03 · 약점으로 쌓인다</text>
    <text x="736" y="556">04 · 되돌려준다</text>
  </g>
  <g stroke="#b9cfea" stroke-width="2" stroke-linecap="round">
    <line x1="64" y1="132" x2="104" y2="132" />
    <line x1="64" y1="304" x2="104" y2="304" />
    <line x1="64" y1="530" x2="104" y2="530" />
    <line x1="736" y1="530" x2="776" y2="530" />
  </g>

  <!-- ── 01 입력 ─────────────────────────────────────────── -->
  <g filter="url(#cCard)">
    <rect x="64" y="192" width="292" height="104" rx="14" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
    <rect x="392" y="192" width="292" height="104" rx="14" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
    <rect x="720" y="192" width="292" height="104" rx="14" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
  </g>
  <g font-size="15" font-weight="700" fill="#1b2a4a">
    <text x="88" y="226">GitHub Pull Request</text>
    <text x="416" y="226">코드 붙여넣기 · 업로드</text>
    <text x="744" y="226">비로그인 체험</text>
  </g>
  <g font-size="12.5" fill="#5c7099">
    <text x="88" y="250">Webhook으로 PR 이벤트를 받는다</text>
    <text x="416" y="250">스튜디오에서 파일·텍스트를 직접 넣는다</text>
    <text x="744" y="250">가입 없이 3회까지 같은 파이프라인</text>
  </g>
  <g font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a4a85">
    <rect x="88" y="262" width="146" height="21" rx="6" fill="#1b2a4a" fill-opacity=".07" />
    <text x="97" y="277">GitHub Webhook</text>
    <rect x="416" y="262" width="128" height="21" rx="6" fill="#1b2a4a" fill-opacity=".07" />
    <text x="425" y="277">AiInputType</text>
    <rect x="744" y="262" width="152" height="21" rx="6" fill="#1b2a4a" fill-opacity=".07" />
    <text x="753" y="277">GuestReviewService</text>
  </g>

  <!-- 01 → 02 -->
  <g fill="none" stroke="#8fa3c4" stroke-width="1.6">
    <path d="M210 296 V336" />
    <path d="M538 296 V336" />
    <path d="M866 296 V336" />
    <path d="M210 336 H866" />
    <path d="M538 336 V378" marker-end="url(#cArrow)" />
  </g>

  <!-- ── 02 리뷰 파이프라인 ──────────────────────────────── -->
  <g filter="url(#cLift)">
    <rect x="180" y="382" width="716" height="140" rx="18" fill="#1b2a4a" />
  </g>
  <text x="208" y="412" font-size="13" font-weight="700" fill="#8fd9c4" letter-spacing=".6">리뷰 파이프라인</text>
  <g font-size="13.5" font-weight="600" fill="#fff">
    <text x="208" y="452">Diff 추출</text>
    <text x="356" y="452">AST 최소 컨텍스트</text>
    <text x="560" y="452">벤더 라우팅</text>
    <text x="726" y="452">응답 파싱</text>
  </g>
  <g font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#9fd8c6">
    <text x="208" y="472">changed files</text>
    <text x="356" y="472">JavaParser</text>
    <text x="560" y="472">AiProvider · AiModel</text>
    <text x="726" y="472">LENIENT_JSON</text>
  </g>
  <g font-size="11" fill="#a9bcd9">
    <text x="208" y="496">바뀐 부분만 보낸다</text>
    <text x="356" y="496">주변 코드를 최소로 붙여 토큰을 줄인다</text>
    <text x="560" y="496">플랜별 허용 모델</text>
    <text x="726" y="496">코드펜스·제어문자 방어</text>
  </g>
  <g stroke="#4a5f86" stroke-width="1">
    <line x1="340" y1="432" x2="340" y2="504" />
    <line x1="544" y1="432" x2="544" y2="504" />
    <line x1="710" y1="432" x2="710" y2="504" />
  </g>

  <!-- 벤더 4곳 -->
  <g filter="url(#cCard)">
    <rect x="932" y="382" width="244" height="140" rx="18" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
  </g>
  <text x="956" y="410" font-size="13" font-weight="700" fill="#1b2a4a">벤더 4곳</text>
  <g font-size="12.5" fill="#31456b">
    <text x="956" y="436">Claude</text>
    <text x="1060" y="436">GPT</text>
    <text x="956" y="460">Gemini</text>
    <text x="1060" y="460">Groq</text>
  </g>
  <g font-size="10.5" fill="#7c8fb0">
    <text x="956" y="486">Anthropic 형식 / OpenAI 호환 형식으로</text>
    <text x="956" y="500">호출 경로를 갈라 둔다</text>
  </g>
  <text x="956" y="516" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    fill="#c0563f">연결 10초 · 응답 60초 타임아웃</text>
  <path d="M896 452 H926" fill="none" stroke="#8fa3c4" stroke-width="1.6" marker-end="url(#cArrow)" />

  <!-- 02 → 03 -->
  <path d="M300 522 V590" fill="none" stroke="#8fa3c4" stroke-width="1.6" marker-end="url(#cArrow)" />

  <!-- ── 03 약점 누적 ────────────────────────────────────── -->
  <g filter="url(#cCard)">
    <rect x="64" y="594" width="300" height="118" rx="14" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
    <rect x="64" y="726" width="300" height="118" rx="14" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
    <rect x="396" y="594" width="292" height="250" rx="14" fill="#fff" stroke="#4ec9a4" stroke-opacity=".55" />
  </g>

  <text x="88" y="626" font-size="15" font-weight="700" fill="#1b2a4a">리뷰 이슈 저장</text>
  <text x="88" y="650" font-size="12.5" fill="#5c7099">심각도 · 카테고리 · 파일 · 라인</text>
  <text x="88" y="672" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a4a85">review_issues</text>
  <text x="88" y="696" font-size="11" fill="#7c8fb0">의도한 코드로 처리하면 집계에서 빠진다</text>

  <text x="88" y="758" font-size="15" font-weight="700" fill="#1b2a4a">약점 집계</text>
  <text x="88" y="782" font-size="12.5" fill="#5c7099">카테고리 · 언어로 묶어 3회 이상만</text>
  <text x="88" y="804" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a4a85">getWeaknessStats()</text>
  <text x="88" y="828" font-size="11" fill="#c0563f">표에 쓰지 않고 조회 시점에 계산 — 동시 호출 500 제거</text>
  <path d="M214 712 V720" fill="none" stroke="#8fa3c4" stroke-width="1.6" marker-end="url(#cArrow)" />

  <!-- 학습 카드 -->
  <text x="420" y="626" font-size="15" font-weight="700" fill="#166e5b">학습 카드 · 퀴즈</text>
  <text x="420" y="650" font-size="12.5" fill="#4b7c70">약점에서 개념 · 예제 · 문제를 만든다</text>
  <g font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#166e5b">
    <text x="420" y="678">LearningPromptBuilder</text>
    <text x="420" y="698">checkAndConsume()</text>
  </g>
  <text x="420" y="722" font-size="11" fill="#5f8a7e">수준 3단 × 모델 티어 3단을 조합해</text>
  <text x="420" y="736" font-size="11" fill="#5f8a7e">같은 약점도 플랜에 따라 다르게 낸다</text>
  <rect x="420" y="750" width="244" height="1" fill="#4ec9a4" fill-opacity=".4" />
  <text x="420" y="774" font-size="11.5" font-weight="600" fill="#166e5b">크레딧 선차감 → 파싱 실패 시 롤백</text>
  <text x="420" y="792" font-size="11" fill="#5f8a7e">예외를 던져 트랜잭션이 되돌아가면</text>
  <text x="420" y="806" font-size="11" fill="#5f8a7e">차감한 크레딧도 함께 복구된다</text>
  <text x="420" y="830" font-size="11.5" font-weight="600" fill="#a8620a">승급 — 정답 3회 노랑, 7회 초록</text>
  <path d="M364 700 H390" fill="none" stroke="#3fb894" stroke-width="1.6" marker-end="url(#cArrowMint)" />

  <!-- ── 04 되돌려주기 ───────────────────────────────────── -->
  <g filter="url(#cCard)">
    <rect x="736" y="594" width="440" height="76" rx="14" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
    <rect x="736" y="686" width="440" height="76" rx="14" fill="#fff" stroke="#1b2a4a" stroke-opacity=".14" />
    <rect x="736" y="778" width="440" height="66" rx="14" fill="#fffdf3" stroke="#ffd23f" stroke-opacity=".8" />
  </g>
  <text x="760" y="624" font-size="14.5" font-weight="700" fill="#1b2a4a">성장 추이</text>
  <text x="760" y="646" font-size="12" fill="#5c7099">발생 · 해결 건수를 주 단위로 쌓아 기간별로 견준다</text>
  <text x="1050" y="624" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a4a85">weeklySummary</text>

  <text x="760" y="716" font-size="14.5" font-weight="700" fill="#1b2a4a">주간 리포트 메일</text>
  <text x="760" y="738" font-size="12" fill="#5c7099">지난주 월~일을 집계해 전주 대비 증감과 함께 보낸다</text>
  <text x="1050" y="716" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1a4a85">WeeklyReportSender</text>

  <text x="760" y="806" font-size="14.5" font-weight="700" fill="#8a5b06">학습 습관</text>
  <text x="760" y="828" font-size="12" fill="#8a6a2a">제출한 날만 세어 streak을 잇고, 달력 점은 제출 이력에서 끌어낸다</text>
  <text x="1050" y="806" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a8620a">recordSubmission()</text>

  <g fill="none" stroke="#8fa3c4" stroke-width="1.6" marker-end="url(#cArrow)">
    <path d="M688 632 H730" />
    <path d="M688 700 V724 H730" />
    <path d="M542 844 V858 H900 V768" />
  </g>

  <!-- 순환 라벨 -->
  <text x="906" y="862" font-size="11.5" font-weight="600" fill="#3fb894">푼 문제가 다시 제출 기록으로 남는다</text>
</svg>
